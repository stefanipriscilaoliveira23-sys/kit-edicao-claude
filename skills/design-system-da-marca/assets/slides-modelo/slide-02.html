<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><title>slide-02 conteudo</title>
<link rel="stylesheet" href="marca.css">
<style>
  html,body{margin:0;width:1080px;height:1350px;overflow:hidden}
  body{position:relative;font-family:var(--fonte-corpo);box-sizing:border-box}
  .tag{position:absolute;top:56px;right:80px;font-size:20px;letter-spacing:4px;text-transform:uppercase;opacity:.65;font-weight:600;text-align:right;line-height:1.4}
  .rod{position:absolute;bottom:56px;left:0;right:0;text-align:center;font-size:18px;letter-spacing:5px;text-transform:uppercase;opacity:.7}
  .num{position:absolute;top:56px;left:80px;font-family:var(--fonte-titulo);font-style:italic;font-size:44px}
  .miolo{position:absolute;left:100px;right:100px;top:50%;transform:translateY(-50%)}
  .eb1{font-size:26px;letter-spacing:5px;text-transform:uppercase;font-weight:400;margin-bottom:10px}
  .eb2{font-size:26px;letter-spacing:5px;text-transform:uppercase;font-weight:700;margin-bottom:24px}
  .t-rom{font-family:var(--fonte-titulo);font-weight:700;font-size:150px;line-height:.92}
  .t-ita{font-family:var(--fonte-titulo);font-style:italic;font-size:150px;line-height:.92}
  .mao{font-family:var(--fonte-manuscrita);font-size:64px;display:inline-block;transform:rotate(-4deg);margin-top:24px}
  .h{font-family:var(--fonte-titulo);font-style:italic;font-size:96px;line-height:1;margin-bottom:36px}
  p{font-size:40px;line-height:1.4;margin:0 0 26px}
  b{font-weight:700;color:var(--cor-destaque)}
  .pilula{display:inline-block;background:var(--cor-destaque);color:var(--cor-claro);border-radius:999px;padding:18px 44px;font-weight:700;font-size:34px;letter-spacing:3px;text-transform:uppercase}
</style></head>
<body style="background:var(--cor-fundo);color:var(--cor-texto)">
  <div class="num" style="color:var(--cor-destaque)">02</div>
  <div class="tag">NOME DA MARCA<br>@SEUARROBA</div>
  <div class="miolo">
    <div class="h">O motivo real é outro.</div>
    <p>Você não precisa de <b>mais horário</b>.</p>
    <p>Precisa de um jeito de confirmar, cobrar e organizar que funcione <span style="text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:10px">sem você</span>.</p>
  </div>
  <div class="rod">@seuarroba · o que você faz</div>
</body></html>
